---
# DEPLOYS {{ cookiecutter.project_name }} TO A UBUNTU 24.04 DIGITALOCEAN DROPLET
# ADAPTED FROM ~/git_repos/_services_/ansible-playbooks (install-apache / install-marshall-webapp
# pattern) — THAT BASELINE IS 2019-ERA CONDA-BASED SCAFFOLDING AND WAS RE-WRITTEN HERE FOR A
# STANDARD PYTHON VENV + MARIADB ON UBUNTU 24.04, NOT REUSED DIRECTLY.
- hosts: webapp
  become: true
  vars:
    app_slug: "{{ cookiecutter.project_slug }}"
    app_user: "{{ cookiecutter.project_slug }}"
    app_dir: "/home/{{ cookiecutter.project_slug }}/{{ cookiecutter.project_slug }}"
    deploy_host: "{{ cookiecutter.deploy_host }}"
    # SET db_password AND django_secret_key VIA --extra-vars OR ansible-vault, NOT COMMITTED HERE
  roles:
    - install-apache
{%- if cookiecutter.database_backend == "sqlite_dev_mariadb_prod" %}
    - install-mariadb
{%- endif %}
    - install-webapp
